# 安全標頭的單一來源。被 default.conf.template 的 server 層與三個 location 各 include 一次。
#
# 為什麼是 include 而不是靠繼承：nginx 的 add_header **不繼承**——只要某個 location 自己寫了
# 一行 add_header，server 層那一整組就對它失效。所以每個有 add_header 的 location 都得把
# 安全標頭重寫一次。以前是四處各抄兩行，改標頭要記得四處一起改（漏一處不會有任何錯誤，
# 只是那個路徑安靜地少了標頭）；抽成這一支之後只改這裡。
#
# 為什麼放在 templates/ 卻不叫 .template：官方映像的 20-envsubst-on-templates.sh 只處理
# /etc/nginx/templates/*.template，所以 .conf 會被原樣留在那裡、剛好可以被 include
# （這裡沒有任何 ${…} 參照，不需要 envsubst）。好處是 compose／Dockerfile／k8s ConfigMap
# 都已經是「掛整個 templates 目錄」，多一個檔零新增掛載。
#
# ⚠️ 絕對不要改放到 /etc/nginx/conf.d/：主 nginx.conf 有 include conf.d/*.conf，
#    它會被當成獨立設定檔吃掉（http 層出現裸的 add_header），而不是被這裡 include。
#
# Cache-Control 刻意不放進來：那是每個 location 自己的語意（index.html 不快取、
# /assets/ 永久快取），不是共用的安全標頭。
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;

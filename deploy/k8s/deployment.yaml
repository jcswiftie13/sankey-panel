# 與本機 docker-compose.yml 同一套心智模型：
#   initContainer 把 content 映像的 /dist 倒進共享 volume → nginx 容器唯讀掛來端。
# 差別只有 compose 用 named volume（要先清空，因為會留到下次）、
# 這裡用 emptyDir（每個 pod 都是全新的，不需要清）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trace-sankey
  labels:
    app: trace-sankey
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trace-sankey
  template:
    metadata:
      labels:
        app: trace-sankey
    spec:
      initContainers:
        - name: content
          # tag 由 kustomization.yaml 的 images: 覆寫。
          image: trace-sankey-content
          command: ["sh", "-c", "cp -a /dist/. /html/"]
          volumeMounts:
            - name: web
              mountPath: /html
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: web
              mountPath: /usr/share/nginx/html
              readOnly: true
            # 掛整個 conf.d 目錄（不是單一檔案）：這樣官方映像自帶的
            # default.conf 會被整組取代掉，不會有兩個 server 區塊打架。
            - name: conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: web
          emptyDir: {}
        - name: conf
          configMap:
            name: trace-sankey-nginx

# 網頁與 nginx 拆成兩層：內容在自己的小映像裡，nginx 用官方映像＋掛載。
#   改 deploy/templates/default.conf.template → docker compose restart web（完全不用 build）
#     （只 nginx -s reload 不會生效：reload 不重跑 envsubst，見 template 檔頭）
#   換一版網頁           → make up（只重建那個幾 MB 的 content 映像）
#   nginx 升版           → 改下面的 tag 就好，內容不動
#
# 為什麼要一個一次性的 content service，不直接把映像宣告成 volume 來源：
# Docker 只有在 named volume「是空的」時才會拿映像內容填充它，之後永遠不再更新。
# 靠那個行為的話，第二次換網頁會安靜地繼續端舊內容——所以這裡明確地先清空再複製。
#
# Docker 28+ / Compose 2.35+ 其實支援 `type: image` 直接把映像掛成 volume，寫起來更短。
# 沒用它是因為 k8s 的對應功能（Image Volume Source）1.33 才 beta 且要 runtime 配合，
# 目標叢集未知不能賭；init 複製法在 compose 與所有 k8s 版本上的心智模型完全一樣。
# 專案名沿用 compose 的預設（= 目錄名），拆分前建的容器才會被同一個 make down 收掉；
# 改成別的名字會讓舊容器變成沒人管的孤兒，繼續佔著 port。dev 那份才用不同名字。
name: sankey-panel

services:
  # 倒完內容就結束的一次性任務，不是常駐服務。
  content:
    build:
      context: .
      target: content
    image: ${CONTENT_IMAGE:-trace-sankey-content}:${TAG:-latest}
    volumes:
      - web:/html
    # 三個 glob 是為了連 dotfile 一起清掉（`/html/*` 掃不到）；
    # rm -rf 對不存在的路徑本來就回 0，所以不會因為 volume 是空的而失敗。
    command: sh -c 'rm -rf /html/* /html/.[!.]* /html/..?* 2>/dev/null; cp -a /dist/. /html/'
    restart: "no"

  web:
    # 官方映像零客製：設定與內容都從外面掛進來。
    image: nginx:1.27-alpine
    depends_on:
      content:
        condition: service_completed_successfully
    environment:
      # 強制：官方 entrypoint 的 envsubst 沒有 filter 時會把 conf 裡的 $host、$uri…
      # 全部換成空字串，而 try_files 那行換完仍是合法語法 → 整站靜默壞掉。
      # 詳見 deploy/templates/default.conf.template 檔頭。這個值不是機密，寫死在這裡。
      NGINX_ENVSUBST_FILTER: "^TRACE_"
      # 後端的 service token，X-API-Key 的值（例：export TRACE_API_AUTH='sk-…'）。
      # `:-` 讓沒設定時是「已定義的空字串」而不是「未定義」——未定義的話 envsubst 不認得它，
      # dollar-brace 參照會原樣留在渲染結果裡，後端收到字面字串然後回 401。
      TRACE_API_AUTH: ${TRACE_API_AUTH:-}
    volumes:
      - web:/usr/share/nginx/html:ro
      # 掛目錄不掛單檔：單檔 bind mount 綁 inode，編輯器存檔換掉 inode
      # 之後容器內那支檔案會消失（見 deploy/templates/default.conf.template 檔頭）。
      - ./deploy/templates:/etc/nginx/templates:ro
    # conf.d 是 envsubst 的輸出目的地，必須可寫，不能再掛成唯讀。
    # 用 tmpfs 而不是讓它留在映像層：順便蓋掉官方自帶的 default.conf（不會有兩個 server 區塊），
    # 而且渲染出來、帶著明文 token 的那份 conf 只留在記憶體裡、不落到容器磁碟。
    tmpfs:
      - /etc/nginx/conf.d
    # 對外 port 只有這一個來源；Makefile 的 PORT 會傳進來，不用兩邊手動同步。
    ports:
      - "${PORT:-8080}:80"
    restart: unless-stopped

volumes:
  web:
